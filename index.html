
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Site Pessoal do Sady</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0a0a0d;
            color: #eeeeff;
        }

        .menu-lateral {
            width: 250px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #17171d;
            border-right: 1px solid #30303b;
            padding: 28px 16px;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
            text-align: center;
            color: #32cfff;
            margin-bottom: 8px;
        }

        .subtitulo-menu {
            text-align: center;
            color: #85859a;
            font-size: 12px;
            margin-bottom: 35px;
        }

        .menu-lateral h3 {
            color: #77778b;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 12px 14px;
        }

        .menu-opcao {
            display: block;
            width: 100%;
            padding: 15px 14px;
            margin-bottom: 8px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            text-align: left;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .menu-opcao:hover,
        .menu-opcao.ativa {
            background: #25252f;
            border-color: #393946;
            transform: translateX(3px);
        }

        .vida { color: #32cfff; }
        .proposito { color: #bd83ff; }
        .saude { color: #4de39a; }
        .amor { color: #ff70ae; }
        .profissional { color: #ffb454; }

        .conteudo {
            margin-left: 250px;
            padding: 45px;
        }

        .topo {
            padding-bottom: 25px;
            border-bottom: 1px solid #292933;
            margin-bottom: 30px;
        }

        .topo h1 {
            margin: 0 0 10px;
            font-size: 30px;
            color: #32cfff;
        }

        .topo p {
            color: #9999ad;
            margin: 0;
        }

        .painel {
            background: #17171d;
            border: 1px solid #30303b;
            border-radius: 12px;
            padding: 28px;
            min-height: 220px;
        }

        .painel h2 {
            margin-top: 0;
            font-size: 23px;
        }

        .painel p {
            color: #b4b4c5;
            line-height: 1.7;
        }

        .linha {
            width: 55px;
            height: 4px;
            border-radius: 5px;
            margin-bottom: 22px;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 14px;
            background: #0e0e13;
            color: #eeeeff;
            border: 1px solid #383845;
            border-radius: 8px;
            resize: vertical;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        textarea:focus {
            outline: 1px solid #32cfff;
        }

        .salvar {
            margin-top: 14px;
            padding: 12px 20px;
            background: #102b42;
            color: #32cfff;
            border: 1px solid #32cfff;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .salvar:hover {
            background: #17405f;
        }

        #mensagem {
            font-size: 13px;
            margin-top: 12px;
        }

        @media (max-width: 650px) {
            .menu-lateral {
                width: 100%;
                height: auto;
                position: relative;
                padding: 20px 14px;
                border-right: none;
                border-bottom: 1px solid #30303b;
            }

            .subtitulo-menu {
                margin-bottom: 20px;
            }

            .menu-lateral h3 {
                margin-top: 15px;
            }

            .menu-opcao {
                display: inline-block;
                width: auto;
                margin: 3px;
                padding: 12px;
            }

            .conteudo {
                margin-left: 0;
                padding: 24px 16px;
            }
        }
    </style>
</head>

<body>

    <aside class="menu-lateral">
        <div class="logo">◆ SADY</div>
        <div class="subtitulo-menu">Meu espaço pessoal</div>

        <h3>Menu principal</h3>

        <button class="menu-opcao vida ativa"
                data-secao="vida"
                data-testid="menu-vida">
            ✦ &nbsp; Vida
        </button>

        <button class="menu-opcao proposito"
                data-secao="proposito"
                data-testid="menu-proposito">
            ◎ &nbsp; Propósito
        </button>

        <button class="menu-opcao saude"
                data-secao="saude"
                data-testid="menu-saude">
            ✚ &nbsp; Saúde
        </button>

        <button class="menu-opcao amor"
                data-secao="amor"
                data-testid="menu-amor">
            ♡ &nbsp; Amor
        </button>

        <button class="menu-opcao profissional"
                data-secao="profissional"
                data-testid="menu-profissional">
            ▣ &nbsp; Profissional
        </button>
    </aside>

    <main class="conteudo">
        <header class="topo">
            <h1 id="titulo" data-testid="titulo-secao">
                Site Pessoal do Sady
            </h1>
            <p id="descricao">
                Bem-vindo ao meu espaço pessoal!
            </p>
        </header>

        <section class="painel">
            <div class="linha" id="linha"></div>

            <h2 id="subtitulo-painel">Minha vida</h2>

            <p id="texto-painel">
                Este é meu espaço pessoal. Aqui vou organizar
                minhas informações, ideias, projetos e objetivos.
            </p>

            <textarea
                id="anotacao"
                data-testid="campo-anotacao"
                placeholder="Escreva suas ideias aqui..."
            ></textarea>

            <button
                class="salvar"
                id="btn-salvar"
                data-testid="botao-salvar"
            >
                Salvar anotação
            </button>

            <p id="mensagem" data-testid="mensagem-status"></p>
        </section>
    </main>

    <script>
        const secoes = {
            vida: {
                titulo: "Vida",
                descricao: "Bem-vindo ao meu espaço pessoal!",
                subtitulo: "Minha vida",
                texto: "Aqui vou organizar minhas ideias, meus planos e minhas prioridades.",
                cor: "#32cfff"
            },

            proposito: {
                titulo: "Propósito",
                descricao: "Meus sonhos e objetivos.",
                subtitulo: "Meu propósito",
                texto: "Aqui vou registrar meus valores, sonhos e objetivos de longo prazo.",
                cor: "#bd83ff"
            },

            saude: {
                titulo: "Saúde",
                descricao: "Meu bem-estar em primeiro lugar.",
                subtitulo: "Minha saúde",
                texto: "Aqui vou organizar informações sobre hábitos saudáveis e autocuidado.",
                cor: "#4de39a"
            },

            amor: {
                titulo: "Amor",
                descricao: "Relacionamentos e conexões importantes.",
                subtitulo: "Meus relacionamentos",
                texto: "Aqui vou registrar reflexões sobre relacionamentos, carinho e conexões.",
                cor: "#ff70ae"
            },

            profissional: {
                titulo: "Profissional",
                descricao: "Meus projetos e minha carreira.",
                subtitulo: "Minha carreira",
                texto: "Aqui vou organizar meus projetos, habilidades e objetivos profissionais.",
                cor: "#ffb454"
            }
        };

        const botoes = document.querySelectorAll(".menu-opcao");
        const titulo = document.getElementById("titulo");
        const descricao = document.getElementById("descricao");
        const subtituloPainel =
            document.getElementById("subtitulo-painel");
        const textoPainel = document.getElementById("texto-painel");
        const linha = document.getElementById("linha");
        const anotacao = document.getElementById("anotacao");
        const mensagem = document.getElementById("mensagem");

        let secaoAtual = "vida";

        const anotacoes = {
            vida: "",
            proposito: "",
            saude: "",
            amor: "",
            profissional: ""
        };

        function abrirSecao(nome) {
            anotacoes[secaoAtual] = anotacao.value;
            secaoAtual = nome;

            const dados = secoes[nome];

            titulo.textContent = dados.titulo;
            titulo.style.color = dados.cor;
            descricao.textContent = dados.descricao;
            subtituloPainel.textContent = dados.subtitulo;
            subtituloPainel.style.color = dados.cor;
            textoPainel.textContent = dados.texto;
            linha.style.backgroundColor = dados.cor;

            anotacao.value = anotacoes[nome];
            mensagem.textContent = "";

            botoes.forEach(botao => {
                const selecionado =
                    botao.dataset.secao === nome;

                botao.classList.toggle("ativa", selecionado);
                botao.setAttribute(
                    "aria-current",
                    selecionado ? "page" : "false"
                );
            });
        }

        botoes.forEach(botao => {
            botao.addEventListener("click", () => {
                abrirSecao(botao.dataset.secao);
            });
        });

        document.getElementById("btn-salvar")
            .addEventListener("click", () => {
                anotacoes[secaoAtual] = anotacao.value;

                mensagem.style.color = secoes[secaoAtual].cor;
                mensagem.textContent =
                    "Anotação guardada nesta sessão!";
            });

        abrirSecao("vida");
    </script>

</body>
</html>
